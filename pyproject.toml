[project]
name = "advent-of-code"
version = "0.1.0"
description = ""
readme = "README.md"
authors = [
    {name = "Darshan A S", email = "itisdarshan@gmail.com"}
]
requires-python = ">=3.12"
dependencies = [
    "toolz>=1.0.0",
    "pyfunctional>=1.5.0",
    "sortedcontainers>=2.4.0",
    "more-itertools>=10.5.0"
]

[dependency-groups]
dev = [
    "black>=24.10.0",
    "pylint>=3.3.1",
    "bandit>=1.8.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

